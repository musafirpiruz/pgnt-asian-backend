name: Backend Syntax Check

on:
  pull_request:
    paths:
      - "server.js"
      - "migrate.js"
      - "package.json"
      - "firebase-auth.js"
      - "firebase-admin-adapter.js"
      - "tests/firebase-admin-adapter.test.js"
      - "phone-auth.js"
      - "master-country-pricing.js"
      - "network-product-approval.js"
      - "stripe-fee-estimator.js"
      - "stripe-fee-evidence.js"
      - "dtone-product-detail-adapter.js"
      - "dtone-master-workbook-parser.js"
      - "dtone-master-catalog-reconciliation.js"
      - "dtone-master-workbook-reconciliation-routes.js"
      - "tests/dtone-product-detail-adapter.test.js"
      - "tests/dtone-master-catalog-reconciliation.test.js"
      - "tests/dtone-master-workbook-parser.test.js"
      - "tests/dtone-fixed-recharge.test.js"
      - "tests/dtone-sandbox-persistence-safety.test.js"
      - "tests/dtone-sandbox-runtime-persistence.test.js"
      - "tests/dtone-master-workbook-reconciliation-routes.test.js"
      - "tests/dtone-master-workbook-reconciliation.integration.test.js"
      - "tests/master-country-pricing.test.js"
      - "tests/network-product-approval.test.js"
      - "tests/stripe-fee-estimator.test.js"
      - "tests/stripe-fee-evidence.test.js"
      - "tests/stripe-fee-rounding.test.js"
      - "tests/stripe-fee-settings-validation.test.js"
      - "tests/firebase-auth.test.js"
      - "tests/phone-auth.test.js"
      - ".github/workflows/backend-check.yml"
  push:
    branches:
      - main
      - "fix/schema-server-compatibility"
      - "feat/device-region-and-country-bootstrap-2026-11-10"
    paths:
      - "server.js"
      - "migrate.js"
      - "package.json"
      - "firebase-auth.js"
      - "firebase-admin-adapter.js"
      - "phone-auth.js"
      - "master-country-pricing.js"
      - "network-product-approval.js"
      - "stripe-fee-estimator.js"
      - "stripe-fee-evidence.js"
      - "dtone-fixed-recharge.js"
      - "dtone-product-detail-adapter.js"
      - "dtone-master-workbook-parser.js"
      - "dtone-master-catalog-reconciliation.js"
      - "dtone-master-workbook-reconciliation-routes.js"
      - "tests/**"
      - ".github/workflows/backend-check.yml"

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check migrate.js
          node --check firebase-auth.js
          node --check firebase-admin-adapter.js
          node --check phone-auth.js
          node --check master-country-pricing.js
          node --check network-product-approval.js
          node --check stripe-fee-estimator.js
          node --check stripe-fee-evidence.js
          node --check dtone-product-detail-adapter.js
          node --check dtone-master-workbook-parser.js
          node --check dtone-master-catalog-reconciliation.js
          node --check dtone-master-workbook-reconciliation-routes.js
