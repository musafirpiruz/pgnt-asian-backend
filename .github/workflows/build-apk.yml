
name: Build PGNT ASIAN TOPUP APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'main.dart'
      - 'main_FIXED_FINAL.dart'
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check repository files
        shell: bash
        run: |
          set -euo pipefail
          echo "Repository: $GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          pwd
          ls -la

          if [ ! -f "$GITHUB_WORKSPACE/pubspec.yaml" ]; then
            echo "ERROR: pubspec.yaml is missing from repository root."
            exit 1
          fi

      - name: Prepare Flutter source
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          mkdir -p lib

          if [ -f "main_FIXED_FINAL.dart" ]; then
            cp main_FIXED_FINAL.dart lib/main.dart
            echo "Using main_FIXED_FINAL.dart"
          elif [ -f "main.dart" ]; then
            cp main.dart lib/main.dart
            echo "Using root main.dart"
          elif [ -s "lib/main.dart" ]; then
            echo "Using existing lib/main.dart"
          else
            echo "ERROR: No Dart entry file found."
            exit 1
          fi

          test -s lib/main.dart
          echo "Flutter source prepared:"
          wc -l lib/main.dart

      - name: Generate missing Android project files
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          if [ ! -d android ]; then
            flutter create \
              --platforms=android \
              --project-name=pgnt_asian_topup \
              .
          fi

          test -d android
          test -f pubspec.yaml
          test -f lib/main.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: dart analyze lib/main.dart

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=BACKEND_BASE_URL=https://pgnt-asian-backend.onrender.com

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pgnt-asian-topup-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
          
