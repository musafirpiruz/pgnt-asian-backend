name: Build Android APK - PGNT FIXED

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.22.3'
          cache: true

      - name: Create Android project if missing
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --project-name pgnt_asian_topup .
          fi

      - name: FORCE COPY PGNT APP (Fix Demo Issue)
        run: |
          echo "=== COPYING YOUR PGNT APP ==="
          if [ -f "main.dart" ]; then
            cp -f main.dart lib/main.dart
            echo "✅ Copied root main.dart -> lib/main.dart"
          fi
          if [ -f "main_FIXED_FINAL.dart" ]; then
            cp -f main_FIXED_FINAL.dart lib/main.dart
          fi
          wc -l lib/main.dart
          head -30 lib/main.dart

      - name: Get dependencies
        run: flutter pub get

      - name: Enable Internet permission
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
              sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET" \/>\n    <application/' "$MANIFEST"
            fi
          fi

      - name: Build APK - PGNT ASIAN TOPUP
        run: |
          flutter build apk --release --dart-define=BACKEND_BASE_URL=https://pgnt-asian-backend.onrender.com --no-tree-shake-icons -v

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pgnt-asian-topup-apk-FIXED
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
          
