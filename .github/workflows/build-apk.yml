
name: Build PGNT ASIAN TOPUP APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'main.dart'
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Flutter source
        run: |
          set -e

          if [ -f "main_FIXED_FINAL.dart" ]; then
            cp main_FIXED_FINAL.dart lib/main.dart
          elif [ -f "main.dart" ]; then
            cp main.dart lib/main.dart
          elif [ -f "lib/main.dart" ]; then
            echo "Using lib/main.dart"
          else
            echo "ERROR: No main.dart file found"
            exit 1
          fi

          echo "Selected app source:"
          wc -l lib/main.dart
          head -20 lib/main.dart

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify project files
        run: |
          set -e
          test -f pubspec.yaml
          test -f lib/main.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Check Dart code
        run: dart analyze lib/main.dart

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=BACKEND_BASE_URL=https://pgnt-asian-backend.onrender.com

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pgnt-asian-topup-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
          
