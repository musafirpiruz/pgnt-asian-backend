name: Build PGNT ASIAN TOPUP APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/schema-server-compatibility
      - ui/homepage-redesign
      - feature/vip-support-screen
      - ui/optional-profile-in-settings
      - fix/persist-order-history-secure-tokens
      - fix/referral-first-topup-rewards
      - fix/android-internet-permission
      - fix/refund-statuses-mainline
      - fix/operator-brand-cards-current-mainline
      - fix/support-label-current-main
      - feat/referral-deep-link-autofill-mainline
      - feat/admin-assigned-referral-links-dynamic-countries
      - feat/flutter-support-ticket-history
      - i18n/localize-support-faqs
      - ui/five-step-flow-current-main-v2
      - fix/flutter-disable-unverified-referral-ui
      - feature/firebase-id-token-verification-core
    paths:
      - 'main.dart'
      - 'main_FIXED_FINAL.dart'
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check repository files
        shell: bash
        run: |
          set -euo pipefail
          test -f "$GITHUB_WORKSPACE/pubspec.yaml"

      - name: Prepare Flutter source
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          mkdir -p lib
          if [ -f "main_FIXED_FINAL.dart" ]; then
            cp main_FIXED_FINAL.dart lib/main.dart
          elif [ -f "main.dart" ]; then
            cp main.dart lib/main.dart
          elif [ ! -s "lib/main.dart" ]; then
            echo "ERROR: No Dart entry file found."
            exit 1
          fi
          test -s lib/main.dart

      - name: Generate missing Android project files
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name=pgnt_asian_topup .
          fi
          test -d android
          test -f android/app/src/main/AndroidManifest.xml

      - name: Set and verify permanent Android application ID
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          expected = "com.pgnt.asian.topup"
          candidates = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]
          gradle = next((p for p in candidates if p.is_file()), None)
          if gradle is None:
              raise SystemExit("ERROR: Android app Gradle file not found.")

          source = gradle.read_text(encoding="utf-8")
          for key in ("namespace", "applicationId"):
              pattern = rf'(?m)^(\s*{key}\s*(?:=\s*)?)["\'][^"\']+["\']'
              source, count = re.subn(pattern, rf'\g<1>"{expected}"', source, count=1)
              if count != 1:
                  raise SystemExit(f"ERROR: could not safely set {key} in {gradle}.")

          gradle.write_text(source, encoding="utf-8")
          check = gradle.read_text(encoding="utf-8")
          if not re.search(rf'(?m)^\s*namespace\s*(?:=\s*)?["\']{re.escape(expected)}["\']', check):
              raise SystemExit("ERROR: namespace verification failed.")
          if not re.search(rf'(?m)^\s*applicationId\s*(?:=\s*)?["\']{re.escape(expected)}["\']', check):
              raise SystemExit("ERROR: applicationId verification failed.")
          print(f"Verified Android namespace and applicationId: {expected}")
          PY

      - name: Ensure Android network permissions
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text(encoding="utf-8")
          required = [
              "android.permission.INTERNET",
              "android.permission.ACCESS_NETWORK_STATE",
          ]
          for permission in required:
              if permission not in text:
                  tag = f'    <uses-permission android:name="{permission}" />\n'
                  match = re.search(r"(?m)^\s*<application\b", text)
                  if not match:
                      raise SystemExit("ERROR: <application> tag not found.")
                  text = text[:match.start()] + tag + text[match.start():]
          path.write_text(text, encoding="utf-8")
          for permission in required:
              if permission not in text:
                  raise SystemExit(f"ERROR: missing {permission}")
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: dart analyze lib/main.dart

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=BACKEND_BASE_URL=https://pgnt-asian-backend.onrender.com

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pgnt-asian-topup-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
