name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.22.3'
          cache: true

      - name: Flutter Version
        run: flutter --version

      - name: Create Flutter Android project if needed
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --project-name pgnt_asian_topup .
          fi
          ls -la lib/

      - name: Get dependencies
        run: flutter pub get

      - name: Enable Android Internet
        run: |
          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET" \/>\n    <application/' android/app/src/main/AndroidManifest.xml || true
          fi

      - name: Build APK
        run: |
          flutter build apk --release --dart-define=BACKEND_BASE_URL=https://pgnt-asian-backend.onrender.com --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pgnt-asian-topup-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
          
