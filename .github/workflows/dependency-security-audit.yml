name: Dependency Security Audit

on:
  push:
    branches:
      - main
      - feat/customer-ranged-catalog-2026-11-13
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies without lifecycle scripts
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Audit production dependencies (fail on moderate or higher)
        run: npm audit --omit=dev --audit-level=moderate

      - name: Audit the complete dependency tree (fail on moderate or higher)
        run: npm audit --audit-level=moderate

      - name: Verify installed top-level dependency tree
        run: npm ls --depth=0
