name: Backend tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pgnt_test
          POSTGRES_PASSWORD: pgnt_test_password
          POSTGRES_DB: pgnt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pgnt_test -d pgnt_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://pgnt_test:pgnt_test_password@localhost:5432/pgnt_test
      NODE_ENV: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Apply migrations to isolated PostgreSQL test database
        run: node migrate.js
      - name: Prepare legacy refunds table without migration 013 uniqueness
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/refund-migration-013-prepare.sql
      - name: Upgrade legacy refunds table with migration 013
        run: node migrate.js
      - name: Verify migration 013 restores refund uniqueness
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/refund-migration-013-verify.sql
      - name: Verify referral reservation constraints and idempotency in PostgreSQL
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/referral-migration.integration.sql
      - name: Reconstruct pre-009 schema with an existing ledger row
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/referral-migration-upgrade-prepare.sql
      - name: Upgrade existing database to migration 009
        run: node migrate.js
      - name: Verify migration 009 preserves existing ledger rows
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/referral-migration-upgrade-verify.sql
      - name: Run regression tests
        run: npm test
